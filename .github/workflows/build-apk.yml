name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract v1.2.0 project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "FloatingBarcodeScanner-v1.2.0-KeyboardAutoFill-Source.zip" -d extracted
          test -f extracted/FloatingBarcodeScanner/settings.gradle
          test -f extracted/FloatingBarcodeScanner/app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
      - name: Compile APK
        working-directory: extracted/FloatingBarcodeScanner
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBarcodeScanner-v1.2.0-debug-apk
          path: extracted/FloatingBarcodeScanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
